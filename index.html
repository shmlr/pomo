<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomoDag</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: #f4f7f6; --text: #34495e; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: var(--text); margin: 0; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.07); width: 100%; max-width: 420px; border: 1px solid #eee; position: relative; }
        .settings-toggle { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 22px; color: #bdc3c7; z-index: 10; }
        #clock { font-size: 52px; font-weight: 800; text-align: center; color: var(--primary); letter-spacing: -1px; }
        #date { text-align: center; font-size: 12px; color: #95a5a6; text-transform: uppercase; margin-bottom: 20px; }
        #offset-panel { background: #f8f9fa; border-radius: 12px; display: flex; justify-content: space-around; font-size: 10px; overflow: hidden; max-height: 0; transition: 0.4s; }
        #offset-panel.open { max-height: 100px; padding: 15px; margin-bottom: 20px; border: 1px solid #eee; }
        #offset-panel input { width: 38px; border: 1px solid #ddd; text-align: center; border-radius: 5px; padding: 4px; }
        .prayer-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 20px; }
        .p-card { background: #fff; padding: 10px 2px; border-radius: 10px; text-align: center; border: 1px solid #f0f0f0; transition: 0.3s; }
        .p-card.next { border-color: #27ae60; background: #f0fff4; }
        .p-card.done { opacity: 0.4; }
        .p-card span { font-size: 8px; font-weight: bold; color: #95a5a6; text-transform: uppercase; display: block; }
        .p-card b { font-size: 12px; color: #2c3e50; display: block; }
        .timer-box { text-align: center; background: #fafafa; padding: 20px; border-radius: 18px; margin-bottom: 20px; border: 1px solid #eee; }
        #main-timer { font-size: 68px; font-weight: bold; color: var(--accent); line-height: 1; }
        #status-bar { font-size: 11px; font-weight: 700; color: #7f8c8d; margin-top: 10px; text-transform: uppercase; }
        #stop-btn { display: none; margin-top: 12px; background: #e74c3c; color: #fff; border: none; padding: 8px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .input-area { background: #f1f3f4; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        input[type=text], input[type=time], input[type=number], select { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
        .task-list { list-style: none; padding: 0; }
        .task-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: white; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; font-size: 13px; }
        .task-item.done { opacity: 0.5; background: #f9f9f9; }
        .task-item.done span { text-decoration: line-through; }
        .btn-del { color: #e74c3c; border: none; background: none; cursor: pointer; font-weight: bold; font-size: 16px; }
        #init-btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; margin-bottom: 6px; cursor: pointer; font-size: 15px; }
        .hint { text-align: center; font-size: 11px; color: #95a5a6; margin-bottom: 14px; }
        #notif-status { text-align: center; font-size: 12px; margin-bottom: 10px; padding: 8px; border-radius: 8px; display: none; }
        #notif-status.ok { background: #d4edda; color: #155724; display: block; }
        #notif-status.err { background: #fff3cd; color: #856404; display: block; }
        .next-banner { background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px; padding: 10px 14px; text-align: center; font-size: 13px; color: #856404; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="container">
    <div class="settings-toggle" onclick="document.getElementById('offset-panel').classList.toggle('open')">⚙</div>

    <button id="init-btn" onclick="activateAlerts()">🔔 ВКЛЮЧИТЬ ЗВУК И УВЕДОМЛЕНИЯ</button>
    <div class="hint">Сигнал работает, пока эта вкладка открыта на экране</div>
    <div id="notif-status"></div>
    <div class="next-banner" id="next-banner"></div>

    <div id="clock">00:00:00</div>
    <div id="date">ЗАГРУЗКА...</div>

    <div id="offset-panel">
        <div>Фад<br><input type="number" id="off1" value="0" onchange="fetchPrayers()"></div>
        <div>Зух<br><input type="number" id="off2" value="0" onchange="fetchPrayers()"></div>
        <div>Аср<br><input type="number" id="off3" value="0" onchange="fetchPrayers()"></div>
        <div>Маг<br><input type="number" id="off4" value="0" onchange="fetchPrayers()"></div>
        <div>Иша<br><input type="number" id="off5" value="0" onchange="fetchPrayers()"></div>
    </div>

    <div class="prayer-grid" id="prayer-cards"></div>

    <div class="timer-box">
        <div id="main-timer">00:00</div>
        <div id="status-bar">ОЖИДАНИЕ</div>
        <button id="stop-btn" onclick="stopTask()">ОСТАНОВИТЬ</button>
    </div>

    <div class="input-area">
        <input type="text" id="tName" placeholder="Название задачи">
        <div style="display:flex;gap:8px">
            <input type="time" id="tTime" style="flex:2">
            <input type="number" id="tDur" placeholder="Мин" min="1" style="flex:1">
        </div>
        <select id="tRepeat">
            <option value="none">Один раз</option>
            <option value="daily">Каждый день</option>
            <option value="weekdays">Будни (Пн-Пт)</option>
        </select>
        <button class="btn-add" onclick="addTask()">ДОБАВИТЬ В ПЛАН</button>
    </div>

    <ul id="taskList" class="task-list"></ul>
</div>

<script>
    // ── Хранилище: не падает, если localStorage недоступен ──
    const store = {
        get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; } },
        set(k, v)   { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
    };

    let prayerTimes   = {};
    let lastFetchDate = '';
    let tasks         = store.get('pomo_tasks', []);
    let activeTimer   = null;   // { interval, taskId, name }
    let lastMinute    = '';
    let notifiedPrayers = {};   // { 'дата': { 'Зухр': true, ... } }
    let audioCtx      = null;
    let notifyEnabled = false;

    // ── Звук: ОДИН общий AudioContext (без утечки) ──
    function ensureAudio() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function beep(freq = 880, dur = 0.8) {
        if (!audioCtx) return;
        try {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.3, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            o.start(); o.stop(audioCtx.currentTime + dur);
        } catch(e) {}
    }

    // ── Включение сигналов (требует нажатия — иначе звук заблокирован браузером) ──
    async function activateAlerts() {
        ensureAudio();
        beep(660, 0.25);
        document.getElementById('init-btn').style.display = 'none';

        if (!('Notification' in window)) {
            setStatus('err', '🔊 Звук включён. Системные уведомления этот браузер не поддерживает.');
            return;
        }
        try {
            const perm = await Notification.requestPermission();
            if (perm === 'granted') {
                notifyEnabled = true;
                setStatus('ok', '✅ Звук и уведомления включены (пока вкладка открыта).');
            } else {
                setStatus('err', '🔊 Звук включён. Уведомления не разрешены — можно включить их в настройках браузера.');
            }
        } catch(e) {
            setStatus('err', '🔊 Звук включён.');
        }
    }

    function setStatus(type, msg) {
        const el = document.getElementById('notif-status');
        el.className = type; el.textContent = msg;
    }

    function notify(title, body, isPrayer) {
        beep(isPrayer ? 528 : 880, isPrayer ? 1.0 : 0.6);
        if (notifyEnabled && 'Notification' in window && Notification.permission === 'granted') {
            // На некоторых телефонах конструктор недоступен — оборачиваем, чтобы не падало
            try {
                const n = new Notification(title, { body, tag: title });
                n.onclick = () => { window.focus(); n.close(); };
            } catch(e) {}
        }
    }

    // ── Времена намазов (Aladhan API, Махачкала) ──
    async function fetchPrayers() {
        const o = ['off1','off2','off3','off4','off5'].map(id => parseInt(document.getElementById(id).value) || 0);
        const tune = `0,${o[0]},0,${o[1]},${o[2]},${o[3]},0,${o[4]},0`; // 9 значений Aladhan
        const url = `https://api.aladhan.com/v1/timingsByCity?city=Makhachkala&country=Russia&method=3&tune=${tune}`;
        try {
            const res = await fetch(url);
            const d = await res.json();
            const t = d.data.timings;
            prayerTimes = { 'Фаджр': t.Fajr, 'Восход': t.Sunrise, 'Зухр': t.Dhuhr, 'Аср': t.Asr, 'Магриб': t.Maghrib, 'Иша': t.Isha };
        } catch(e) {
            prayerTimes = { 'Фаджр':'04:24', 'Восход':'06:23', 'Зухр':'12:02', 'Аср':'15:21', 'Магриб':'17:59', 'Иша':'19:28' };
        }
        for (const k in prayerTimes) prayerTimes[k] = prayerTimes[k].slice(0, 5); // "04:24 (+03)" -> "04:24"
        lastFetchDate = new Date().toDateString();
        renderPrayers();
    }

    function renderPrayers() {
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const grid = document.getElementById('prayer-cards');
        grid.innerHTML = '';
        let nextName = null;

        Object.entries(prayerTimes).forEach(([name, time]) => {
            const [h, m] = time.split(':').map(Number);
            const done = (h * 60 + m) <= nowMin;
            if (!done && !nextName) nextName = name;
            const div = document.createElement('div');
            div.className = 'p-card' + (done ? ' done' : (name === nextName ? ' next' : ''));
            const s = document.createElement('span'); s.textContent = name;
            const b = document.createElement('b');     b.textContent = time;
            div.append(s, b);
            grid.appendChild(div);
        });

        const banner = document.getElementById('next-banner');
        if (nextName) banner.textContent = `⏰ Следующий: ${nextName} в ${prayerTimes[nextName]}`;
        else banner.textContent = `✅ Намазы на сегодня прошли. Завтра Фаджр в ${prayerTimes['Фаджр'] || '—'}`;
    }

    // ── Часы + проверки раз в минуту (устойчиво к пропущенной секунде :00) ──
    function tick() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').textContent = `${h}:${m}:${s}`;
        document.getElementById('date').textContent =
            now.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' }).toUpperCase();

        const cur = `${h}:${m}`;
        if (cur !== lastMinute) { lastMinute = cur; onNewMinute(now, cur); }
    }

    function onNewMinute(now, cur) {
        const today = now.toDateString();
        if (today !== lastFetchDate) fetchPrayers();   // обновляем времена в новые сутки
        renderPrayers();

        // Намазы (Восход — не намаз, без сигнала)
        if (!notifiedPrayers[today]) notifiedPrayers[today] = {};
        const nowMin = now.getHours() * 60 + now.getMinutes();
        for (const name in prayerTimes) {
            if (name === 'Восход') continue;
            const [ph, pm] = prayerTimes[name].split(':').map(Number);
            const pMin = ph * 60 + pm;
            if (nowMin >= pMin && nowMin < pMin + 2 && !notifiedPrayers[today][name]) {
                notifiedPrayers[today][name] = true;
                notify('🕌 ВРЕМЯ НАМАЗА', `Наступило время: ${name}`, true);
            }
        }

        // Задачи (одна за раз)
        const day = now.getDay();
        for (const t of tasks) {
            const shouldRun = t.repeat === 'none' || t.repeat === 'daily' ||
                              (t.repeat === 'weekdays' && day >= 1 && day <= 5);
            if (t.start === cur && t.lastDone !== today && !activeTimer && shouldRun) {
                notify('⏱️ ПОРА ЗА ЗАДАЧУ', `Начинаем: ${t.name}`, false);
                startTask(t.id);
                break;
            }
        }
    }

    // ── Таймер задачи (поиск по id, не по индексу) ──
    function startTask(taskId) {
        const task = tasks.find(t => t.id === taskId);
        if (!task || activeTimer) return;
        let sec = task.dur * 60;

        document.getElementById('status-bar').textContent = task.name;
        document.getElementById('stop-btn').style.display = 'inline-block';

        const interval = setInterval(() => {
            sec--;
            const mm = String(Math.floor(sec / 60)).padStart(2, '0');
            const ss = String(sec % 60).padStart(2, '0');
            document.getElementById('main-timer').textContent = `${mm}:${ss}`;
            if (sec <= 0) finishTask(true);
        }, 1000);

        activeTimer = { interval, taskId, name: task.name };
    }

    function finishTask(completed) {
        if (!activeTimer) return;
        clearInterval(activeTimer.interval);
        const { taskId, name } = activeTimer;
        activeTimer = null;

        document.getElementById('stop-btn').style.display = 'none';
        document.getElementById('main-timer').textContent = '00:00';
        document.getElementById('status-bar').textContent = 'ОЖИДАНИЕ';

        if (completed) {
            const t = tasks.find(x => x.id === taskId);
            if (t) {
                if (t.repeat === 'none') tasks = tasks.filter(x => x.id !== taskId);
                else t.lastDone = new Date().toDateString();
                save(); renderTasks();
            }
            notify('✅ ЗАДАЧА ЗАВЕРШЕНА', `Готово: ${name}`, false);
        }
    }

    function stopTask() { finishTask(false); }

    // ── Задачи ──
    function addTask() {
        const n = document.getElementById('tName').value.trim();
        const tm = document.getElementById('tTime').value;
        const d = parseInt(document.getElementById('tDur').value);
        const r = document.getElementById('tRepeat').value;
        if (!n || !tm || !d || d < 1) { alert('Заполни название, время и длительность (минимум 1 мин).'); return; }
        tasks.push({ id: Date.now(), name: n, start: tm, dur: d, repeat: r, lastDone: '' });
        tasks.sort((a, b) => a.start.localeCompare(b.start));
        save(); renderTasks();
        document.getElementById('tName').value = '';
        document.getElementById('tDur').value = '';
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        const today = new Date().toDateString();
        list.innerHTML = '';
        tasks.forEach(t => {
            const done = t.lastDone === today;
            const label = t.repeat === 'weekdays' ? '📅 Будни' : t.repeat === 'daily' ? '🔄 Ежедневно' : '📌 Разово';
            const li = document.createElement('li');
            li.className = 'task-item' + (done ? ' done' : '');

            const info = document.createElement('div');
            const small = document.createElement('small');
            small.style = 'display:block;color:#95a5a6';
            small.textContent = label;
            const main = document.createElement('span');
            main.textContent = `${t.start} — ${t.name} (${t.dur} мин)`;
            info.append(small, main);

            const btn = document.createElement('button');
            btn.className = 'btn-del';
            btn.textContent = '✕';
            btn.onclick = () => deleteTask(t.id);

            li.append(info, btn);
            list.appendChild(li);
        });
    }

    function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); save(); renderTasks(); }
    function save() { store.set('pomo_tasks', tasks); }

    fetchPrayers();
    renderTasks();
    tick();
    setInterval(tick, 1000);
</script>
</body>
</html>
